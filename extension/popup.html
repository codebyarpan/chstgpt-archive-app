<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: -apple-system, sans-serif; width: 260px; padding: 16px; color: #1e293b; margin: 0; background: #f8fafc; }
    h2 { font-size: 15px; font-weight: 700; margin: 0 0 6px; }
    p { font-size: 12px; color: #475569; margin: 0 0 12px; line-height: 1.45; }
    #status { font-size: 12px; padding: 8px 10px; background: #f1f5f9; border-radius: 8px; margin-bottom: 12px; line-height: 1.4; }
    button { width: 100%; background: #059669; color: #fff; border: none; border-radius: 8px; padding: 9px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 6px; }
    button:hover { background: #047857; }
    button.secondary { background: #e2e8f0; color: #1e293b; font-weight: 500; }
    button.secondary:hover { background: #cbd5e1; }
  </style>
</head>
<body>
  <h2>ChatGPT Archive</h2>
  <p>On chatgpt.com, click the round green button at the bottom-right to save chats.</p>
  <div id="status">Checking…</div>
  <button id="go">Open ChatGPT</button>
  <button id="opts" class="secondary">Settings</button>
  <script src="popup.js"></script>
</body>
</html>
